name: hub-index

# Builds data/hub-data.json from the members list + their public repos and force-pushes
# it as a single commit on the orphan branch "hub-data", so main's history stays clean
# and the Pages build is not involved.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - members.json
      - blocked.json
      - hub.config.json
      - round.json
      - 'games/**'
      - 'tools/**'
  workflow_run:
    workflows: [hub-members]
    types: [completed]

concurrency:
  group: hub-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch the data that is published now
        run: |
          mkdir -p prev out
          curl -sfL -o prev/hub-data.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/hub-data/hub-data.json" \
            || echo "nothing published yet"

      - name: Build the index
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-index.js --prev prev/hub-data.json --out out/hub-data.json --emit-changed

      - name: Publish to the hub-data branch
        if: steps.build.outputs.changed == 'true'
        run: |
          cp out/hub-data.json "$RUNNER_TEMP/hub-data.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hub-data
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/hub-data.json" hub-data.json
          git add -- hub-data.json
          git commit -m "hub data"
          git push --force origin HEAD:hub-data

      - name: Nothing changed
        if: steps.build.outputs.changed != 'true'
        run: echo "hub-data is already up to date"
