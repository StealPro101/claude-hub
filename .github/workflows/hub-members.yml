name: hub-members

# Join / leave handling.
# No issue field is ever interpolated into a run: script - the node script reads the
# event from the file at $GITHUB_EVENT_PATH instead, so a title or body full of shell
# metacharacters is only ever data.

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: hub-members
  cancel-in-progress: false

jobs:
  handle:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Handle the join / leave form
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/handle-issue.js
