<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
  body{margin:0;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#eaeaf2;touch-action:none}
  h1{margin:0 0 6px;letter-spacing:.15em;background:linear-gradient(90deg,#2dd4bf,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #hud{color:#8a8aa3;margin-bottom:12px;letter-spacing:.1em}
  canvas{border:1px solid #2a2a3d;border-radius:10px;background:#0e0e18;box-shadow:0 0 40px rgba(124,92,255,.2)}
  #msg{margin-top:12px;color:#8a8aa3;font-size:.85rem}
  a{color:#2dd4bf;text-decoration:none}
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<div id="hud">SCORE 0 · BEST 0</div>
<canvas id="c" width="360" height="360"></canvas>
<div id="msg">arrows / WASD / swipe · space to restart · <a href="../../">← arcade</a></div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),hud=document.getElementById("hud");
const N=18,S=cv.width/N;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let snake,dir,nextDir,food,score,dead,best=+(lsGet("snakeBest")||0),tick=0;
function reset(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};nextDir=dir;score=0;dead=false;spawn();}
function spawn(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y));}
function step(){
  if(dead)return;
  dir=nextDir;
  const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  if(snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;best=Math.max(best,score);lsSet("snakeBest",best);return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=10;spawn();}else snake.pop();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#ff6b35";ctx.shadowColor="#ff6b35";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*.35,0,7);ctx.fill();
  ctx.shadowBlur=8;
  snake.forEach((p,i)=>{
    const t=i/snake.length;
    ctx.fillStyle=dead?"#555":`rgb(${45+t*80},${212-t*120},${191+t*40})`;
    ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2);
  });
  ctx.shadowBlur=0;
  hud.textContent=`SCORE ${score} · BEST ${best}`+(dead?" · 💀 SPACE TO RESTART":"");
}
function loop(){tick++;if(tick%8===0)step();draw();requestAnimationFrame(loop);}
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener("keydown",e=>{
  if(e.key===" "){if(dead)reset();return;}
  const k=keys[e.key];if(!k)return;
  if(k[0]!==-dir.x||k[1]!==-dir.y)nextDir={x:k[0],y:k[1]};
  e.preventDefault();
});
let tx,ty;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;if(dead)reset();});
addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  const k=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
  if(k[0]!==-dir.x||k[1]!==-dir.y)nextDir={x:k[0],y:k[1]};
});
reset();loop();
</script>
</body>
</html>
