<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Game — Claude Hub</title>
<style>
  :root{--bg:#0a0a12;--panel:#14141f;--text:#eaeaf2;--dim:#8a8aa3;--neon:#ff6b35;--neon2:#7c5cff;--neon3:#2dd4bf;--border:#2a2a3d}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
  .box{width:100%;max-width:520px}
  h1{font-size:1.6rem;letter-spacing:.08em;margin-bottom:4px;background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:.85rem;margin-bottom:24px}
  label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:16px 0 6px}
  input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:11px 13px;font-size:.95rem}
  input:focus{outline:none;border-color:var(--neon2)}
  .drop{margin-top:16px;border:2px dashed var(--border);border-radius:12px;padding:34px 16px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--neon3);color:var(--text)}
  .drop.has{border-color:var(--neon3);color:var(--neon3)}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;font-weight:800;letter-spacing:.12em;font-size:1rem;color:#fff;background:linear-gradient(90deg,var(--neon),#ff8f5e);cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .msg{margin-top:16px;font-size:.9rem;line-height:1.5;min-height:1.4em}
  .ok{color:var(--neon3)} .bad{color:#ff6b6b}
  a{color:var(--neon3)}
  .back{display:inline-block;margin-bottom:18px;color:var(--dim);text-decoration:none;font-size:.85rem}
  .back:hover{color:var(--text)}
</style>
</head>
<body>
<div class="box">
  <a class="back" href="./">← back to the arcade</a>
  <h1>SUBMIT A GAME</h1>
  <div class="sub">Manual upload — normally your Claude does this for you (see UPLOAD.md)</div>

  <label>Game title</label><input id="title" placeholder="Zombie Golf">
  <label>Your name</label><input id="author" placeholder="Collin">
  <label>Category (this round's theme)</label><input id="category" placeholder="e.g. space">
  <label>Upload token (from the group chat — saved on this device after first use)</label>
  <input id="token" type="password" placeholder="github_pat_...">

  <div class="drop" id="drop">Drop your game's <b>index.html</b> here<br>or click to pick it</div>
  <input type="file" id="file" accept=".html,.htm" hidden>

  <button id="go" disabled>UPLOAD TO THE HUB</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const host = location.hostname;
const OWNER = host.endsWith(".github.io") ? host.split(".")[0] : "OWNER";
const REPO  = host.endsWith(".github.io") ? location.pathname.split("/").filter(Boolean)[0] || "claude-hub" : "claude-hub";

const $ = id => document.getElementById(id);
let fileText = null;

$("token").value = localStorage.getItem("hubToken") || "";

const drop = $("drop"), fileIn = $("file");
drop.onclick = () => fileIn.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]) take(e.dataTransfer.files[0]); };
fileIn.onchange = () => { if(fileIn.files[0]) take(fileIn.files[0]); };

function take(f){
  const r = new FileReader();
  r.onload = () => { fileText = r.result; drop.textContent = "✔ " + f.name + " loaded"; drop.classList.add("has"); check(); };
  r.readAsText(f);
}
["title","author","category","token"].forEach(id => $(id).oninput = check);
function check(){ $("go").disabled = !(fileText && $("title").value.trim() && $("author").value.trim() && $("category").value.trim() && $("token").value.trim()); }

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "game"; }
function b64(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }

async function putFile(token, path, content, msgText){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  let sha = null;
  const ex = await fetch(url, {headers});
  if(ex.ok) sha = (await ex.json()).sha;
  const body = { message: msgText, content: b64(content) };
  if(sha) body.sha = sha;
  const r = await fetch(url, { method:"PUT", headers, body: JSON.stringify(body) });
  if(!r.ok) throw new Error((await r.json()).message || ("HTTP " + r.status));
}

$("go").onclick = async () => {
  const token = $("token").value.trim();
  const slug = slugify($("title").value);
  const msg = $("msg");
  $("go").disabled = true;
  msg.className = "msg"; msg.textContent = "Uploading…";
  try{
    localStorage.setItem("hubToken", token);
    const info = JSON.stringify({ title: $("title").value.trim(), author: $("author").value.trim(), category: $("category").value.trim().toLowerCase() }, null, 2);
    await putFile(token, `games/${slug}/index.html`, fileText, `Add ${slug}`);
    await putFile(token, `games/${slug}/info.json`, info, `Add ${slug} info`);
    msg.className = "msg ok";
    msg.innerHTML = `✔ Uploaded! Your game goes live in ~1 minute → <a href="./">back to the arcade</a>`;
  }catch(e){
    msg.className = "msg bad";
    msg.textContent = "✘ Upload failed: " + e.message + " (is the token right?)";
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
