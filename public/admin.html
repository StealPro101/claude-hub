<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin &middot; Hub</title>
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to the panel</a>
<header id="bar" class="bar"></header>
<main id="main" class="col col--read" tabindex="-1">
  <section class="box off" id="nope">
    <div class="box-head"><h2>Not for you</h2></div>
    <div class="box-body">
      <p id="nopeWhy">This panel belongs to the owner.</p>
      <p class="btn-row mt"><a class="btn" href="/">Back to the games</a></p>
    </div>
  </section>

  <div class="off" id="panel">
    <section class="box">
      <div class="box-head"><h2>Round</h2><span class="sub" id="headline"></span></div>
      <div class="box-body">
        <div class="toolbar">
          <span><label class="label" for="rNum">Number</label>
            <input id="rNum" type="number" min="1" max="9999" class="inline-field"></span>
          <span><label class="label" for="rCat">Category</label>
            <input id="rCat" type="text" maxlength="40" class="inline-field"></span>
          <span class="grow"><label class="label" for="rNote">Note</label>
            <input id="rNote" type="text" maxlength="200"></span>
          <button class="btn btn--sm" id="rSave" type="button">Save round</button>
        </div>
        <p class="msg" id="rMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Invite</h2><span class="sub" id="invState"></span></div>
      <div class="box-body">
        <div class="toolbar">
          <input id="invLink" type="text" readonly aria-label="Join link">
          <button class="btn btn--sm btn--grey" id="invCopy" type="button">Copy link</button>
          <button class="btn btn--sm btn--grey" id="invToggle" type="button">Toggle invite-only</button>
          <button class="btn btn--sm btn--grey" id="invNew" type="button">New code</button>
        </div>
        <p class="msg" id="invMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Refresh</h2><span class="sub" id="refState"></span></div>
      <div class="box-body">
        <p class="btn-row"><button class="btn btn--sm" id="refNow" type="button">Refresh now</button></p>
        <p class="msg" id="refMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Games</h2></div>
      <div class="box-body">
        <table class="table">
          <thead><tr><th>Game</th><th>Maker</th><th>State</th><th>Actions</th></tr></thead>
          <tbody id="games"></tbody>
        </table>
        <p class="msg" id="gMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>House games</h2></div>
      <div class="box-body">
        <table class="table">
          <thead><tr><th>Game</th><th>Name</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody id="house"></tbody>
        </table>
        <p class="msg" id="hMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Members</h2></div>
      <div class="box-body">
        <table class="table">
          <thead><tr><th>Person</th><th>Id</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="members"></tbody>
        </table>
        <p class="msg" id="mMsg"></p>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Banned</h2></div>
      <div class="box-body">
        <table class="table">
          <thead><tr><th>Person</th><th>Id</th><th>When</th><th>Actions</th></tr></thead>
          <tbody id="bans"></tbody>
        </table>
      </div>
    </section>

    <section class="box">
      <div class="box-head"><h2>Activity</h2></div>
      <div class="box-body"><div class="log" id="log"></div></div>
    </section>
  </div>
</main>
<script src="/assets/hub.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
