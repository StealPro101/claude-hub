<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin &mdash; Claude Hub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to the panel</a>

<div class="wrap wrap--wide">
  <header class="top">
    <a class="mark" href="/">Claude Hub</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main id="main">
    <div class="off" id="nope">
      <h1 class="page-title">Not for you</h1>
      <p class="under" id="nopeWhy">This panel belongs to the Hub owner.</p>
      <p class="btn-row mt-l"><a class="btn" href="/">Back to the arcade</a></p>
    </div>

    <div class="off" id="panel">
      <h1 class="page-title">Admin</h1>
      <p class="under" id="headline"></p>

      <section class="panel mt-l">
        <h2>Round</h2>
        <div class="panel-body form-row">
          <span class="field"><label class="label" for="rNum">Number</label>
            <input id="rNum" type="number" min="1" max="9999"></span>
          <span class="field"><label class="label" for="rCat">Category</label>
            <input id="rCat" type="text" maxlength="40"></span>
          <span class="field field--grow"><label class="label" for="rNote">Note</label>
            <input id="rNote" type="text" maxlength="200"></span>
          <button class="btn btn--sm" id="rSave" type="button">Save round</button>
        </div>
        <p class="msg" id="rMsg"></p>
      </section>

      <section class="panel">
        <h2>Invite</h2>
        <p class="under" id="invState"></p>
        <div class="panel-body btn-row">
          <input id="invLink" type="text" readonly aria-label="Join link">
          <button class="btn btn--sm" id="invCopy" type="button">Copy link</button>
          <button class="btn btn--sm" id="invToggle" type="button">Toggle invite-only</button>
          <button class="btn btn--sm" id="invNew" type="button">New code</button>
        </div>
        <p class="msg" id="invMsg"></p>
      </section>

      <section class="panel">
        <h2>Refresh</h2>
        <p class="under" id="refState"></p>
        <p class="btn-row panel-body"><button class="btn btn--sm" id="refNow" type="button">Refresh now</button></p>
        <p class="msg" id="refMsg"></p>
      </section>

      <section class="panel">
        <h2>Games</h2>
        <table class="table">
          <thead><tr><th>Game</th><th>Maker</th><th>State</th><th>Actions</th></tr></thead>
          <tbody id="games"></tbody>
        </table>
        <p class="msg" id="gMsg"></p>
      </section>

      <section class="panel">
        <h2>House games</h2>
        <table class="table">
          <thead><tr><th>Game</th><th>Name</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody id="house"></tbody>
        </table>
        <p class="msg" id="hMsg"></p>
      </section>

      <section class="panel">
        <h2>Members</h2>
        <table class="table">
          <thead><tr><th>Person</th><th>Id</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="members"></tbody>
        </table>
        <p class="msg" id="mMsg"></p>
      </section>

      <section class="panel">
        <h2>Banned</h2>
        <table class="table">
          <thead><tr><th>Person</th><th>Id</th><th>When</th><th>Actions</th></tr></thead>
          <tbody id="bans"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Activity</h2>
        <div class="log" id="log"></div>
      </section>
    </div>
  </main>

  <footer>
    <span>Owner only.</span>
    <span><a href="/">Arcade</a></span>
  </footer>
</div>

<script src="/assets/hub.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
