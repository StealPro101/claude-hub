<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Players &middot; Hub</title>
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to the players</a>
<header id="bar" class="bar"></header>
<main id="main" class="col" tabindex="-1">
  <div id="listView">
    <section class="box">
      <div class="box-head"><h2 id="count">Players</h2></div>
      <div class="box-body"><div class="people-grid" id="people"></div></div>
    </section>
  </div>
  <div id="profileView" class="off">
    <div class="profile-head">
      <img id="pAv" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
      <div>
        <h1 id="pName"></h1>
        <div class="meta" id="pMeta"></div>
        <div id="pPresence"></div>
        <div class="btn-row" id="pActs"></div>
      </div>
    </div>
    <div class="two-up">
      <section class="box" id="aboutBox">
        <div class="box-head"><h2>About</h2></div>
        <div class="box-body"><p id="pBio" class="pre"></p></div>
      </section>
      <section class="box">
        <div class="box-head"><h2>On the Hub</h2></div>
        <div class="box-body"><p id="pStats"></p></div>
      </section>
    </div>
    <section class="box">
      <div class="box-head"><h2>Shared games</h2></div>
      <div class="box-body"><div class="grid" id="pGames"></div><p class="muted" id="pEmpty"></p></div>
    </section>
    <section class="box off" id="lovedBox">
      <div class="box-head"><h2>Loved games</h2></div>
      <div class="box-body"><div class="grid" id="pLoved"></div></div>
    </section>
  </div>
</main>
<footer id="foot"></footer>
<script src="/assets/hub.js"></script>
<script src="/assets/players.js"></script>
</body>
</html>
