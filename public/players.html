<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Players &mdash; Claude Hub</title>
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to the players</a>
<div class="wrap">
  <h1 class="logo">PLAYERS</h1>
  <div class="tag">&#9656; the crew &#9666;</div>
  <nav id="nav" aria-label="Main"></nav>

  <main id="main" tabindex="-1">
    <div id="listView">
      <div class="count" id="count"></div>
      <div class="grid" id="grid"><div class="empty">Loading players&hellip;</div></div>
    </div>

    <div id="profileView" class="off">
      <p><a class="btn alt sm" href="/players.html">&larr; all players</a></p>
      <div class="panel mt-m">
        <div class="phead">
          <img id="pAv" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
          <div>
            <h2 id="pName"></h2>
            <div class="mini" id="pLogin"></div>
            <div class="desc mt-xs narrow" id="pBio"></div>
            <div class="mini mt-s" id="pStats"></div>
          </div>
        </div>
      </div>
      <div class="grid" id="pGames"></div>
    </div>
  </main>

  <footer><a href="/join.html">Join the Hub</a> &middot; <a href="/rules.html">Rules</a></footer>
</div>
<script src="/assets/hub.js"></script>
<script src="/assets/players.js"></script>
</body>
</html>
