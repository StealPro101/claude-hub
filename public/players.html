<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Players &middot; Hub</title>
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to the players</a>
<header id="bar" class="bar"></header>
<main id="main" class="col" tabindex="-1">
  <div id="listView">
    <section class="box box--row">
      <div class="box-head"><h2 id="count">Players</h2></div>
      <div class="box-body"><div class="people-grid" id="people"></div></div>
    </section>
  </div>

  <!-- one person: a wide header card, then what they have made -->
  <div id="profileView" class="off">
    <div class="pro-head">
      <img id="pAv" class="pro-av" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
      <div class="pro-id">
        <h1 id="pName"></h1>
        <div class="pro-at" id="pMeta"></div>
        <div id="pPresence"></div>
      </div>
      <div class="pro-acts" id="pActs"></div>
      <div class="pro-nums" id="pNums"></div>
    </div>
    <p class="pro-about pre off" id="pBio"></p>

    <section class="box box--row">
      <div class="box-head"><h2>Games</h2></div>
      <div class="box-body"><div class="grid" id="pGames"></div><p class="muted" id="pEmpty"></p></div>
    </section>

    <section class="box box--row off" id="favBox">
      <div class="box-head"><h2>Favorites</h2><span class="sub">only you see these</span></div>
      <div class="box-body"><div class="grid" id="pFavs"></div></div>
    </section>
  </div>
</main>
<script src="/assets/hub.js"></script>
<script src="/assets/players.js"></script>
</body>
</html>
