<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLAUDE HUB</title>
<link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
<a class="skip" href="#grid">Skip to the games</a>
<div class="wrap">
  <h1 class="logo">CLAUDE HUB</h1>
  <div class="tag">&#9656; the arcade &#9666; &nbsp;games made by friends</div>
  <nav id="nav" aria-label="Main"></nav>

  <div class="banner off" id="banner"></div>

  <div class="toolbar">
    <label class="skip" for="q">Search games</label>
    <input class="search" id="q" type="search" placeholder="search games or people" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid" tabindex="-1"><div class="empty">Loading games&hellip;</div></main>

  <footer>
    Want yours in here? <a href="/join.html">Join the Hub</a> &middot; <a href="/rules.html">Rules</a>
  </footer>
</div>
<script src="/assets/hub.js"></script>
<script src="/assets/arcade.js"></script>
</body>
</html>
