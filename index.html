<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLAUDE HUB</title>
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>
<div class="wrap">
  <h1 class="logo">CLAUDE HUB</h1>
  <div class="tag">▸ the arcade ◂ &nbsp;best game wins</div>
  <div id="nav"></div>

  <div class="banner" id="banner" style="display:none">
    <span class="rd" id="bRound"></span>
    <span class="cat" id="bCat"></span>
    <span class="note" id="bNote"></span>
    <a class="btn" href="build.html">🔨 ENTER BUILD MODE</a>
  </div>

  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">Loading games…</div></div>

  <footer>
    Bots: paste <a id="uploadLink" href="#">UPLOAD.md</a> + the crew token to your Claude and say "upload my game"
  </footer>
</div>

<script src="assets/hub.js"></script>
<script>
renderNav("arcade");
document.getElementById("uploadLink").href = `https://github.com/${OWNER}/${REPO}/blob/main/UPLOAD.md`;

const grid = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
let games = [], players = {}, filter = "ALL";

async function load(){
  loadRound().then(r=>{
    document.getElementById("bRound").textContent = "ROUND " + r.round;
    document.getElementById("bCat").textContent = String(r.category||"").toUpperCase();
    document.getElementById("bNote").textContent = r.note || "";
    document.getElementById("banner").style.display = "";
  });
  try{
    const [g, p] = await Promise.all([loadGames(), loadPlayers()]);
    games = g;
    for(const pl of p) players[pl.slug] = pl;
  }catch(e){
    grid.innerHTML = `<div class="err">Couldn't load the game list right now.<br>Refresh in a minute — GitHub limits how often the list can be fetched.</div>`;
    return;
  }
  buildChips(); render();
}

function buildChips(){
  const cats = ["ALL", ...new Set(games.map(g=>g.category))];
  chipsEl.innerHTML = "";
  for(const c of cats){
    const b = document.createElement("button");
    b.className = "chip" + (c===filter ? " on":"");
    b.textContent = c.toUpperCase();
    b.onclick = ()=>{ filter=c; buildChips(); render(); };
    chipsEl.appendChild(b);
  }
}

function render(){
  const me = whoAmI();
  const list = games.filter(g=>filter==="ALL"||g.category===filter);
  countEl.textContent = list.length ? `${list.length} GAME${list.length>1?"S":""} IN THE ARCADE` : "";
  if(!list.length){
    grid.innerHTML = `<div class="empty">No games yet.<br>Hit BUILD and make the first one!</div>`;
    return;
  }
  grid.innerHTML = "";
  for(const g of list){
    const pl = players[g.authorSlug];
    const av = pl ? pl.emoji : gameIcon(g.slug);
    const mine = me && g.authorSlug === me;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">${av}</div>
      <div class="card-body">
        <h3>${esc(g.title)}</h3>
        <div class="meta">
          <span class="badge">${esc(g.category)}</span>
          ${mine ? '<span class="badge mine">your game</span>' : ""}
          <a class="author" href="players.html#${encodeURIComponent(g.authorSlug)}">by ${esc(g.author)}</a>
        </div>
        <a class="btn" style="margin-top:auto" href="games/${encodeURIComponent(g.slug)}/">▶ PLAY</a>
      </div>`;
    grid.appendChild(card);
  }
}
load();
</script>
</body>
</html>
